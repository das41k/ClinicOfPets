<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клиника питомцев - Список приемов</title>
    <link rel="stylesheet" th:href="@{/css/appointment-styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:if="${error}">
    <p th:text="${error}"></p>
</div>
<div th:if="${info}">
    <p th:text="${info}"></p>
</div>
<div th:if="${appointments.empty}">
    Список приемов пуст!
</div>
<div th:if="not ${appointments.empty}">
    <table>
        <thead>
        <tr>
            <th>№</th>
            <th>Дата приема</th>
            <th>Время приема</th>
            <th> Питомец </th>
            <th> Владелец </th>
            <th> Ветеринар </th>
            <th> Статус </th>
        </tr>
        </thead>
        <tbody>
        <!--/*@thymesVar id="appointment" type="ru.petrosyan.clinicOfPet.model.Appointment"*/-->
        <tr th:each="appointment, iterStatus : ${appointments}" th:object="${appointment}">
            <td th:text="${iterStatus.index}"> 1 </td>
            <td th:text="*{dateAdmission}"> 2025-06-06 </td>
            <td th:text="*{timeAdmission}"> 10:00 </td>
            <td> <a th:href="@{/pet/{id}(id=*{pet.pet_id})}" th:text="*{pet.name}"> Мурка </a> </td>
            <td><a th:href="@{/owner/{id}(id=*{pet.owner.owner_id})}" th:text="*{pet.owner.name}"> Петросян Армен Арташесович</a></td>
            <td> <a th:href="@{/veterinarian/{id}(id=*{veterinarian.veterinarian_id})}" th:text="*{veterinarian.name}"> Барсуков Максим Вячеславович </a> </td>
            <td th:text="*{status.getDbValue()}"> </td>
        </tr>
        </tbody>
    </table>
</div>
<div>
    <a th:href="@{/appointment/new}"> Добавить новый прием </a>
</div>
</body>
</html>
