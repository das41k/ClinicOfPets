<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клиника питомцев - Список владельцев</title>
    <link rel="stylesheet" th:href="@{/css/owner-styles.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:if="${error}">
    <p th:text="${error}"></p>
</div>
<div th:if="${info}">
    <p th:text="${info}"></p>
</div>
<div th:if="${owners.empty}">
    Список владельцев пуст!
</div>
<div th:if="not ${owners.empty}">
    <table>
        <thead>
        <tr>
            <th>№</th>
            <th>ФИО</th>
            <th>Контактный телефон</th>
            <th> Просмотр </th>
        </tr>
        </thead>
        <tbody>
        <!--/*@thymesVar id="owner" type="ru.petrosyan.clinicOfPet.model.Owner"*/-->
        <tr th:each="owner, iterStat : ${owners}" th:object="${owner}">
            <td th:text="${iterStat.index}"> 3 </td>
            <td th:text="*{name}"> Зубенко Михаил Петрович </td>
            <td th:text="*{phone}"> +7 (999) 555 44 44 </td>
            <td>
                <a th:href="@{/owner/{id}(id = *{owner_id})}">
                    Посмотреть сведения
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div>
    <a th:href="@{/owner/new}"> Добавить нового владельца </a>
</div>
</body>
</html>
